[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = ""
version = "0.1.0"
description = "Multi-agent swarm protocols (voting, routing, cascades, debate) with a cost-accuracy benchmark"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Afnan Ahmed Adil" }]
dependencies = ["numpy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["agentswarm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
